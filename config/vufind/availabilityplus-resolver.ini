; Config file for Resolver configuration

; Standard base urls for resolvers
[ResolverBaseURL]
;DAIA = 'https://example.com/daia'
;Folio = 'https://example.com/okapi'
JournalsOnlinePrintElectronic = 'http://services.dnb.de/fize-service/gvr/full.xml'
JournalsOnlinePrintPrint = 'http://services.dnb.de/fize-service/gvr/full.xml'
SFX = 'https://test.com'
SubitoISBN = 'https://www.subito-doc.de/preorder'
SubitoISSN = 'https://www.subito-doc.de/preorder'
Unpaywall = 'https://api.unpaywall.org/v2'

; Parameters that are added to the url used to send a request to a resolver
[ResolverExtraParams]
SFX = '&sfx.service_type=getFullTxt&sfx.response_type=simplexml'
DAIA = '&format=json'
DAIAParent = '&format=json'
SubitoISSN = '&CAT=ZDB'
Unpaywall = '&email=unpaywall_01@example.com'

; For each resolver a section with additional config options can be specified. Currently these are only implemented for DAIA and FulltextFinder
[FulltextFinder]
; Sets the password associated with ResolverBaseURL for FulltextFinder
; password =

[DAIA]
; indicate whether to show hide duplicate url results
; hide_url_duplicates = true|false
; default true
hide_url_duplicates = true

; DAIA services can be grouped
; IMPORTANT: grouping only has an effect, if one of these templates is being used as view-method:
; - ajax/link-daia-group-by-service.phtml
; - ajax/link-daia-group-by-storage.phtml

; NOT IMPLEMENTED YET
; group_by indicates the field to group by
; IMPORTANT: only has an effect if this template is being used: ajax/...
; default is none
; group_by = ""

; sort_groups_by_score indicates whether the groups are sorted, the score from the "best" item is used for the groups, sorting is from lowest to highest
; default = true
sort_groups_by_score = true

; overlay indicates whether the items in a group should not be display immediately, but added to a hidden element which can be overlaid with a click on a link
overlay = true
; overlay_min_count indicates the minimum number of items in a group for the overlay to activate
; default = 1
overlay_min_count = 1
; always_display_overlay_in_record_view indicates whether the overlay should always be used in Record View, independently of what is defined in overlay_min_count
; overlay must be set to true for this setting to have an effect
; default = false
always_display_overlay_in_record_view = false

[DAIAParent]
; indicate whether to show hide duplicate url results
; hide_url_duplicates = true|false
; default true
hide_url_duplicates = true

; DAIA services can be grouped
; IMPORTANT: grouping only has an effect, if one of these templates is being used as view-method:
; - ajax/link-daia-group-by-service.phtml
; - ajax/link-daia-group-by-storage.phtml

; NOT IMPLEMENTED YET
; group_by indicates the field to group by
; IMPORTANT: only has an effect if this template is being used: ajax/...
; default is none
; group_by = ""

; sort_groups_by_score indicates whether the groups are sorted, the score from the "best" item is used for the groups, sorting is from lowest to highest
; default = true
sort_groups_by_score = true

; overlay indicates whether the items in a group should not be display immediately, but added to a hidden element which can be overlaid with a click on a link
overlay = true
; overlay_min_count indicates the minimum number of items in a group for the overlay to activate
; default = 1
overlay_min_count = 1
; always_display_overlay_in_record_view indicates whether the overlay should always be used in Record View, independently of what is defined in overlay_min_count
; overlay must be set to true for this setting to have an effect
; default = false
always_display_overlay_in_record_view = false

[Folio]
; ResolverExtraParams is not used by this resolver, since all request paths are built by the resolver itself.

; Okapi tenant
;tenant = 'tenant_name'

; Credentials of the FOLIO user used by VuFind. This user needs read permissions
; for the inventory (holdings, items, instances and locations).
;username = 'username'
;password = 'password'

; Url used to request an Okapi token
; default: <ResolverBaseURL[Folio]>/authn/login
;auth_uri = 'https://okapi.example.org/authn/login'

; Lifetime in seconds of a cached Okapi token
; The legacy endpoint /authn/login does not return an expiration date, so the
; token is cached for a fixed time and renewed whenever FOLIO answers with 401.
; default = 600
;token_lifetime = 600

; Which id does the index record deliver (see availabilityplus.yaml)?
; instance = FOLIO instance uuid, usually MARC 999 ff $i (default)
; hrid = FOLIO human readable id, usually MARC 001
; With id_type = hrid an additional request is needed to resolve the instance.
;id_type = 'hrid'

; Number of holdings/items requested per api call
; default = 100
;limit = 100

; FOLIO item statuses (comma separated) for which a link to VuFind's hold form is generated
; default = "Checked out"
;hold_statuses = "Checked out,Awaiting pickup,In transit"

; Parameters that are protected by the hash key of the hold link. They have to match the
; HMACKeys in the [Holds] section of the configuration of the ILS driver used for
; placing holds. Available values: id, item_id, holding_id, doc_id (instance
; uuid), status (FOLIO item status), level (always "copy")
; default = holding_id:item_id:status:level
;hold_hmac_keys = "holding_id:item_id:status:level"

; Load the due dates of checked out items from /circulation/loans? This needs an
; additional request per holdings record with checked out items and the
; permission to read loans for the FOLIO user. If the request fails, the
; availability is displayed without due date.
; default = false
;load_due_dates = false

; Format of the due date, see https://www.php.net/manual/en/datetime.format.php
; default = d.m.Y
;date_format = "d.m.Y"
